appId: com.frameup.app
productName: Frameup
directories:
  buildResources: build
  output: dist-electron

extraResources:
  - from: build/Assets.car
    to: Assets.car

# Publish releases to GitHub — electron-updater reads from here automatically
publish:
  provider: github
  owner: hungdev
  repo: screenshot-appstore

mac:
  identity: "Apple Development: Hung Vu (9ZLG5T6RNH)"
  extendInfo:
    CFBundleIconFile: AppIcon
    CFBundleIconName: AppIcon
  target:
    - dmg
    - zip          # zip required for macOS auto-update (Squirrel)
  category: public.app-category.developer-tools
  icon: AppIcon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Enable notarization in CI only after Apple credentials are configured.
  notarize: false

win:
  target:
    - nsis         # installer
    - nsis-web     # web installer (smaller download)
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

protocols:
  name: frameup
  schemes:
    - frameup
